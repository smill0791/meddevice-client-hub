<template>
  <article class="slds-card">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__figure">
          <lightning-icon
            icon-name="standard:asset_object"
            size="small"
          ></lightning-icon>
        </div>
        <div class="slds-media__body">
          <h2 class="slds-card__header-title">Device Details</h2>
        </div>
      </header>
    </div>

    <div class="slds-card__body slds-card__body_inner">
      <!-- Loading -->
      <template lwc:if={isLoading}>
        <c-loading-skeleton variant="detail" count="1"></c-loading-skeleton>
      </template>

      <!-- Empty -->
      <template lwc:elseif={isEmpty}>
        <c-empty-state
          title="Device Not Found"
          message="We couldn't load details for this device."
          icon-name="standard:asset_object"
        >
        </c-empty-state>
      </template>

      <!-- Error -->
      <template lwc:elseif={error}>
        <c-error-panel errors={error}></c-error-panel>
      </template>

      <!-- Content -->
      <template lwc:else>
        <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
          <h3 class="slds-text-heading_small">{asset.Name}</h3>
          <c-status-badge status={asset.Status}></c-status-badge>
        </div>

        <dl class="slds-list_horizontal slds-wrap detail-grid">
          <dt class="slds-item_label slds-text-color_weak">Serial Number</dt>
          <dd class="slds-item_detail">{asset.SerialNumber}</dd>

          <template lwc:if={productName}>
            <dt class="slds-item_label slds-text-color_weak">Product</dt>
            <dd class="slds-item_detail">{productName}</dd>
          </template>

          <template lwc:if={asset.Device_Category__c}>
            <dt class="slds-item_label slds-text-color_weak">Category</dt>
            <dd class="slds-item_detail">{asset.Device_Category__c}</dd>
          </template>

          <template lwc:if={asset.InstallDate}>
            <dt class="slds-item_label slds-text-color_weak">Installed</dt>
            <dd class="slds-item_detail">
              <lightning-formatted-date-time
                value={asset.InstallDate}
                year="numeric"
                month="short"
                day="2-digit"
              >
              </lightning-formatted-date-time>
            </dd>
          </template>

          <template lwc:if={asset.Error_Code__c}>
            <dt class="slds-item_label slds-text-color_weak">
              Last Error Code
            </dt>
            <dd class="slds-item_detail slds-text-color_error">
              {asset.Error_Code__c}
            </dd>
          </template>

          <template lwc:if={warrantyState}>
            <dt class="slds-item_label slds-text-color_weak">Warranty</dt>
            <dd class="slds-item_detail">
              <lightning-icon
                icon-name={warrantyState.icon}
                size="xx-small"
                class="slds-m-right_xx-small"
              ></lightning-icon>
              <span class={warrantyState.class}>{warrantyState.label}</span>
              <template lwc:if={asset.Warranty_Expiry__c}>
                (<lightning-formatted-date-time
                  value={asset.Warranty_Expiry__c}
                  year="numeric"
                  month="short"
                  day="2-digit"
                >
                </lightning-formatted-date-time
                >)
              </template>
            </dd>
          </template>
        </dl>
      </template>
    </div>
  </article>
</template>
